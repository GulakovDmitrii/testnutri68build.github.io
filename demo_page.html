<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoIndex</title>
    <link rel="stylesheet" href="demostyle.css">
</head>
<body>
    <!-- Шапка -->
     <header class="header">
        <div class="container">
            <div class="logo">
                <h2>Ваше лого</h2>
            </div>
            <nav class="nav">
                <div class="elemNav">
                    <a href="#">
                        <div class="elemNavBtnContent">
                            <span class="elemNavBtnText">Для кого</span>
                        </div>
                        <span class="elemNavBtnBorder"></span>
                    </a>
                </div>
                <div class="elemNav">
                    <a href="#">
                        <div class="elemNavBtnContent">
                            <span class="elemNavBtnText">Услуги</span>
                        </div>
                        <span class="elemNavBtnBorder"></span>
                    </a>
                </div>
                <div class="elemNav">
                    <a href="#">
                        <div class="elemNavBtnContent">
                            <span class="elemNavBtnText">Контакты</span>
                        </div>
                        <span class="elemNavBtnBorder"></span>
                    </a>
                </div>
                <div class="elemNav">
                    <a href="#">
                        <div class="elemNavBtnContent">
                            <span class="elemNavBtnText">+7 (916) 123-45-67</span>
                        </div>
                        <span class="elemNavBtnBorder"></span>
                    </a>
                </div>
                <div class="linkcontainer">
                    <div class="linkcontent">
                        <div class="linkNav" id="Telegram"></div>
                        <div class="linkNav" id="WhatsApp"></div>
                        <div class="linkNav" id="Max">
                            <a href="#" class="linkMax">Max</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
     </header>
     <!-- Контент Hero-->
     <section class="hero">
        <div class="container">
            <div class="heroContent">
                <h1>Заголовок</h1>
                <p>Описание</p>
                <button class="btn">Кнопка</button>
            </div>
        </div>
     </section>
    
</body>
</html>
